services:
  mariadb:
    image: mariadb:11.8
    container_name: mariadb-php
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: oratorio
      MARIADB_USER: app
      MARIADB_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: